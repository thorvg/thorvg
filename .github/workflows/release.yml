name: Release
on:
  release:
    types: [published]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: "thorvg"
      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install meson ninja-build
      - name: Create source archive
        run: |
          meson setup builddir thorvg -Dextra="lottie_exp,openmp"
          meson dist -C builddir
          cd builddir/meson-dist
          for archive in *.tar.xz; do
            xz --decompress "$archive"
            tar --delete --file="${archive%.xz}" "${archive%.tar.xz}/test"
            xz "${archive%.xz}"
            sha256sum "$archive" > "$archive.sha256sum"
          done
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: builddir/meson-dist/*.xz
