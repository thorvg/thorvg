name: Pixel Inspector Report

on:
  workflow_run:
    workflows: ["Pixel Inspector"]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Download pixel summary
        uses: actions/download-artifact@v4
        with:
          path: ci-report
          pattern: thorvg-pixel-summary
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportHeader = '## Pixel Inspector Report';
            const workflowRun = context.payload.workflow_run;
            const reportPath = path.join('ci-report', 'reporter.md');

            // The pixel inspector generates reporter.md; publish it as-is.
            let body = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8').trimEnd()
              : `${reportHeader}\n\nPixel report was not generated.`;
            // The header identifies the comment to update on later runs.
            if (!body.startsWith(reportHeader)) body = `${reportHeader}\n\n${body}`;

            // reporter.md is PR-controlled: neutralize @mentions and cap the size
            // below GitHub's 65536-char comment limit.
            body = body.replace(/@(\w)/g, '@\u200b$1');
            const maxLength = 60000;
            if (body.length > maxLength) body = body.slice(0, maxLength) + '\n\n(truncated)';
            body += '\n\n';

            // Return the PR number from workflow_run.pull_requests when it is uniquely present.
            function extractPayloadPrNumber() {
              const prs = Array.isArray(workflowRun.pull_requests) ? workflowRun.pull_requests : [];
              const numbers = prs
                .map(pr => Number(pr.number))
                .filter(n => Number.isInteger(n) && n > 0);
              return numbers.length === 1 ? numbers[0] : null;
            }

            // Look up the open PR number by matching the workflow run's head owner and branch.
            async function lookupPrNumberByHeadBranch() {
              const headOwner = workflowRun.head_repository?.owner?.login;
              const headBranch = workflowRun.head_branch;

              if (!headOwner || !headBranch) {
                return null;
              }

              const response = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${headOwner}:${headBranch}`,
                per_page: 10,
              });

              const prs = response.data;
              if (prs.length === 1) return prs[0].number;
              return null;
            }

            function readArtifactPrNumber() {
              const prPath = path.join('ci-report', 'pr-number.txt');
              if (!fs.existsSync(prPath)) return null;
              const value = Number(fs.readFileSync(prPath, 'utf8').trim());
              return Number.isInteger(value) && value > 0 ? value : null;
            }

            let prNumber = extractPayloadPrNumber();
            if (!prNumber) {
              prNumber = await lookupPrNumberByHeadBranch();
            }

            // pr-number.txt is produced by the PR-controlled
            // run, so it is untrusted and only consulted when the trusted payload/branch lookups fail.
            if (!prNumber) {
              prNumber = readArtifactPrNumber();
            }

            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(
                `Could not resolve a unique PR number for workflow run ${workflowRun.id} ` +
                `(head=${workflowRun.head_repository?.full_name || 'unknown'}:${workflowRun.head_branch || 'unknown'})`
              );
              return;
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: workflowRun.id,
              per_page: 100,
            });

            const pdfArtifact = artifacts.find(artifact =>
              artifact.name === `thorvg-pixel-report-PR-${prNumber}` && !artifact.expired
            );

            if (pdfArtifact) {
              const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${workflowRun.id}/artifacts/${pdfArtifact.id}`;
              body += `- [Download PDF report](${url})\n`;
            } else {
              body += '- PDF report skipped: nothing to report.\n';
            }

            core.info(`Resolved PR number: #${prNumber}`);

            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existingComments = comments.filter(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.user?.type === 'Bot' &&
              comment.body?.includes(reportHeader)
            );

            const existingComment = existingComments.at(-1);
            core.info(`Found ${existingComments.length} matching pixel report comment(s).`);
            core.info(`Selected comment id: ${existingComment?.id ?? 'none'}`);

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              core.info(`Updated pixel report comment: ${existingComment.html_url}`);
            } else {
              const response = await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              core.info(`Created pixel report comment: ${response.data.html_url}`);
            }
