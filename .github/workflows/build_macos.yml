name: macOS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unbreak Python in GitHub Actions
      run: |
        find /usr/local/bin -lname '*/Library/Frameworks/Python.framework/*' -delete
        sudo rm -rf /Library/Frameworks/Python.framework/
        brew install --force python3 && brew unlink python3 && brew link --overwrite python3

    - name: Install Packages
      run: |
        brew update
        brew install meson

    - name: Build
      run: |
        meson setup build -Dlog=true -Dloaders=all,media -Dsavers=all -Dstatic=true -Dthreads=false -Dextra="lottie_exp"
        ninja -C build install

  unit_test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unbreak Python in GitHub Actions
      run: |
        find /usr/local/bin -lname '*/Library/Frameworks/Python.framework/*' -delete
        sudo rm -rf /Library/Frameworks/Python.framework/
        brew install --force python3 && brew unlink python3 && brew link --overwrite python3

    - name: Install Packages
      run: |
        brew update
        brew install meson

    - name: Build
      run: |
        meson setup build -Dloaders=all,media -Dsavers=all -Dbindings=capi -Dtests=true -Dextra="lottie_exp" --errorlogs
        ninja -C build install test

    - uses: actions/upload-artifact@v4
      with:
        name: UnitTestReport
        path: build/meson-logs/testlog.txt
