name: Windows

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Install Packages
      run: |
        pip install meson ninja

    - name: Build
      run: |
        meson setup build -Dlog=true -Dloaders=all -Dsavers=all -Dstatic=true -Dthreads=false -Dextra="lottie_exp,openmp"
        where link
        ninja -C build install

    - uses: actions/upload-artifact@v7
      with:
        name: result_windows_static
        path: build/src/thorvg*

  unit_test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Install Packages
      run: |
        pip install meson ninja

    - name: Build
      run: |
        meson setup build -Dloaders=all -Dsavers=all -Dbindings=capi -Dtests=true -Dextra="lottie_exp,openmp" --errorlogs
        where link
        ninja -C build install test

    - uses: actions/upload-artifact@v7
      with:
        name: UnitTestReport
        path: build/meson-logs/testlog.txt
