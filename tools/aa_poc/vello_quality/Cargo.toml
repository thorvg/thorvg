[package]
name = "vello-aa-quality"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
pollster = "=0.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
vello = "=0.10.0"

[profile.release]
lto = "thin"
codegen-units = 1
