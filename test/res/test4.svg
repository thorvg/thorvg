<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="450" viewBox="0 0 600 450">
  <defs>
    <rect id="unit" width="12" height="12" fill="#4a7"/>
    <!-- 1. default objectBoundingBox cell + userSpace content (identity content transform), single child -->
    <pattern id="p1" width="0.25" height="0.25">
      <circle cx="10" cy="10" r="8" fill="#e23"/>
    </pattern>
    <!-- 2. userSpaceOnUse cell, multiple children (tile scene) -->
    <pattern id="p2" patternUnits="userSpaceOnUse" width="30" height="30">
      <rect width="15" height="15" fill="#27a"/>
      <rect x="15" y="15" width="15" height="15" fill="#27a"/>
    </pattern>
    <!-- 3. patternContentUnits=objectBoundingBox (bbox-scaled content transform) -->
    <pattern id="p3" patternContentUnits="objectBoundingBox" width="0.2" height="0.2">
      <circle cx="0.1" cy="0.1" r="0.08" fill="#2a5"/>
    </pattern>
    <!-- 4. patternTransform (invertible: exercises grid bounds inverse-transform) -->
    <pattern id="p4" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#d80"/>
    </pattern>
    <!-- 5. viewBox-driven content transform -->
    <pattern id="p5" patternUnits="userSpaceOnUse" width="40" height="40" viewBox="0 0 10 10">
      <path d="M0 0 L10 10 M10 0 L0 10" stroke="#609" stroke-width="2" fill="none"/>
    </pattern>
    <!-- 6. mixed child types: g / use / image / text are built, symbol / clipPath / mask / pattern / filter are skipped -->
    <pattern id="p6" patternUnits="userSpaceOnUse" width="50" height="50">
      <g transform="translate(2 2)">
        <rect width="10" height="10" fill="#333"/>
        <circle cx="20" cy="6" r="5" fill="#933"/>
      </g>
      <use xlink:href="#unit" x="30" y="2"/>
      <image x="2" y="30" width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAEklEQVR4nGO4Y6PxHxkzkC4AAMO4I/Ftkr0jAAAAAElFTkSuQmCC"/>
      <text x="30" y="45" font-size="14" fill="#06c">A</text>
      <symbol id="sym1"><rect width="8" height="8" fill="#000"/></symbol>
      <clipPath id="cp1"><rect width="8" height="8"/></clipPath>
      <mask id="m1"><rect width="8" height="8" fill="#fff"/></mask>
      <pattern id="pNested" patternUnits="userSpaceOnUse" width="10" height="10"><rect width="5" height="5" fill="#000"/></pattern>
      <filter id="f1"><feGaussianBlur stdDeviation="1"/></filter>
    </pattern>
    <!-- 7. pattern without children: fill must be skipped -->
    <pattern id="pEmpty" patternUnits="userSpaceOnUse" width="20" height="20"/>
    <!-- 8. zero-sized tile cell: pattern disabled -->
    <pattern id="pZero" patternUnits="userSpaceOnUse" width="0" height="20">
      <rect width="10" height="10" fill="#000"/>
    </pattern>
    <!-- 9. only non-buildable child: empty base tile -->
    <pattern id="pSkip" patternUnits="userSpaceOnUse" width="20" height="20">
      <symbol id="sym2"><rect width="8" height="8" fill="#000"/></symbol>
    </pattern>
    <!-- 10. self-referencing pattern: circular reference guard -->
    <pattern id="pCircular" patternUnits="userSpaceOnUse" width="24" height="24">
      <rect width="24" height="24" fill="url(#pCircular)"/>
      <circle cx="12" cy="12" r="10" fill="#a3c"/>
    </pattern>
    <!-- 11. non-invertible patternTransform -->
    <pattern id="pSingular" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="scale(0)">
      <rect width="10" height="10" fill="#000"/>
    </pattern>
  </defs>

  <rect x="10"  y="10"  width="120" height="120" fill="url(#p1)"/>
  <rect x="160" y="10"  width="120" height="120" fill="url(#p2)"/>
  <rect x="310" y="10"  width="120" height="120" fill="url(#p3)"/>
  <rect x="460" y="10"  width="120" height="120" fill="url(#p4)"/>
  <rect x="10"  y="160" width="120" height="120" fill="url(#p5)"/>
  <rect x="160" y="160" width="120" height="120" fill="url(#p6)"/>
  <rect x="310" y="160" width="120" height="120" fill="url(#pEmpty)"/>
  <rect x="460" y="160" width="120" height="120" fill="url(#pZero)"/>
  <rect x="10"  y="310" width="120" height="120" fill="url(#pSkip)"/>
  <rect x="160" y="310" width="120" height="120" fill="url(#pCircular)"/>
  <rect x="310" y="310" width="120" height="120" fill="url(#pSingular)"/>
  <!-- degenerate target bounds: pattern fill must be rejected -->
  <path d="M460 370 H580" fill="url(#p1)" stroke="#000"/>
  <!-- pattern fill on text: not supported yet -->
  <text x="460" y="430" font-size="60" fill="url(#p1)">P</text>
</svg>